[tool.pytest.ini_options]
# Эти файлы — не pytest-тесты, а ручные скрипты для проверки сканеров
# напрямую на реальном хосте (используют .env и живое SSH-соединение).
# Исключены из автосбора, чтобы обычный `pytest` не дёргал реальный SSH.
# Запускать их всё ещё можно явно: pytest tests/test_ssh.py
addopts = [
    "--ignore=tests/test_ssh.py",
    "--ignore=tests/test_users_scanner.py",
    "--ignore=tests/test_updates_scanner.py",
    "--ignore=tests/test_firewall_scanner.py",
    "--ignore=tests/test_scanner.py",
    "--ignore=tests/test_users_data.py",
    "--ignore=tests/test_parser.py",
]
